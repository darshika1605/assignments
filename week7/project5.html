
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: #1e3a8a;
            color: white;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 20px;
        }

        .nav-links a {
            color: white;
            text-decoration: none;
        }

        .navbar button {
            background-color: white;
            color: #1e3a8a;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

        .banner {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 300px;
            background-color: #dbeafe;
            text-align: center;
            color: #1e3a8a;
        }

        .features {
           display: flex;
           justify-content: space-around;
           gap: 20px;
           padding: 30px;
        }

        .feature-card {
           flex: 1;
           padding: 25px;
           background-color: #f0f4f8;
           text-align: center;
           border-radius: 10px;
        }
     
    </style>
</head>

<body>

    <header>

    <nav class="navbar">
        <div class="logo">TechClub</div>

        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
        </div>

        <button>Join Now</button>
    </nav>

    <section class="banner">
       <h1>Welcome to TechClub</h1>
       <p>Learn, Create and Innovate Together!</p>
    </section>

    </header>

    <section class="features">
        <div class="feature-card">
         <h2>Learn</h2>
         <p>Learn new technologies and skills.</p>
        </div>

        <div class="feature-card">
          <h2>Create</h2>
          <p>Build creative projects and ideas.</p>
        </div>

        <div class="feature-card">
          <h2>Innovate</h2>
          <p>Turn your ideas into solutions.</p>
        </div>
    </section>

</body>
</html>
