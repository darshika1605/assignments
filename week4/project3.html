<!DOCTYPE html>
<html lang="en">
<head>
    <title>Tech Club Registration</title>
</head>
<body>
    <h1>Tech Club</h1>
    <h2>Student Registration</h2>

    <h2>Upcoming Events</h2>

    <table border="1">
        <thead>
            <tr>
                <th>Event Name</th>
                <th>Date</th>
                <th>Venue</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Hackathon</td>
                <td>15 November</td>
                <td>Computer Lab</td>
            </tr>
            <tr>
                <td>Coding Competition</td>
                <td>20 November</td>
                <td>Seminar Hall</td>
            </tr>
            <tr>
                <td>Tech Workshop</td>
                <td>25 November</td>
                <td>Lab 2</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="3">Total Events: 3</td>
            </tr>
        </tfoot>
    </table>

    <h2>Registration Form</h2>

    <form>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" required>
        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>

        <label for="date">Date of Birth:</label>
        <input type="date" id="date" name="date">
        <br><br>

        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone">
        <br><br>

        <p>Choose your year:</p>
        <input type="radio" id="first" name="year" value="first">
        <label for="first">First Year</label>

        <input type="radio" id="second" name="year" value="second">
        <label for="second">Second Year</label>
        <br><br>

        <p>Select your interests:</p>
        <input type="checkbox" id="coding" name="interest" value="coding">
        <label for="coding">Coding</label>

        <input type="checkbox" id="web" name="interest" value="web">
        <label for="web">Web Development</label>
        <br><br>

        <label for="event">Choose an event:</label>
        <select id="event" name="event">
            <option value="hackathon">Hackathon</option>
            <option value="coding">Coding Competition</option>
            <option value="workshop">Tech Workshop</option>
        </select>
        <br><br>

        <label for="message">Why do you want to join?</label>
        <br>
        <textarea id="message" name="message" rows="4" cols="30"></textarea>
        <br><br>

        <button type="submit">Register</button>
    </form>
</body>
</html>
