```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Landing Page</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        header {
            background-color: #1e3a8a;
            color: white;
            padding: 15px;
        }

        nav {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        .hero {
            background-color: #dbeafe;
            text-align: center;
            padding: 40px 15px;
        }

        .content {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            padding: 20px;
        }

        .card {
            background-color: #f1f5f9;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        footer {
            background-color: #1e3a8a;
            color: white;
            text-align: center;
            padding: 15px;
        }

        img {
            max-width: 100%;
            height: auto;
        }

        body {
            font-size: 1rem;
        }

        h1 {
            font-size: 2rem;
        }

        h2 {
            font-size: 1.5rem;
        }

        p {
            font-size: 1rem;
        }

        /* Tablet */
        @media (min-width: 768px) {
            nav {
                flex-direction: row;
                justify-content: space-between;
            }

            .hero {
                padding: 60px 30px;
            }

            .content {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        /* Desktop */
        @media (min-width: 1024px) {
            .hero {
                padding: 80px;
            }

            .content {
                max-width: 1200px;
                margin: auto;
                padding: 40px;
                grid-template-columns: repeat(3, 1fr);
            }
        }

        /* Responsive testing - prevent horizontal overflow */
        html, body {
                width: 100%;
                overflow-x: hidden;
            }

        img {
                display: block;
                max-width: 100%;
                height: auto;
                margin: 0 auto;
          }

      @media (max-width: 767px) {
       .card {
                width: 100%;
            }
        }

    </style>
</head>

<body>

    <header>
        <nav>
            <h2>TechClub</h2>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Welcome to TechClub</h1>
        <p>Learn, Create and Innovate Together!</p>
        <img src="https://placehold.co/600x300"
         alt="Technology workspace">
    </section>

    <main class="content">
        <div class="card">
            <h2>Learn</h2>
            <p>Learn new technologies and skills.</p>
        </div>

        <div class="card">
            <h2>Create</h2>
            <p>Build creative projects and ideas.</p>
        </div>

        <div class="card">
            <h2>Innovate</h2>
            <p>Turn ideas into solutions.</p>
        </div>
    </main>

    <footer>
        <p>© 2026 TechClub</p>
    </footer>

</body>
</html>
```
