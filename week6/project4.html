<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile Card</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
        }

        .profile-card {
            width: 350px;
            margin: 20px auto;
            padding: 20px;
            border: 2px solid #2563eb;
            background-color: white;
            text-align: center;
        }

        .profile-card h1 {
            color: #1e3a8a;
        }

        .profile-card p {
            color: #333333;
            line-height: 1.6;
        }

        .bio {
            height: 100px;
            overflow: auto;
            padding: 10px;
            border: 1px solid #cccccc;
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <h1>My Profile</h1>
        <p>Hello! I am a Computer Science student.</p>

        <div class="bio">
            I am learning HTML, CSS, and Java.
            I enjoy learning new technologies and improving my coding skills.
            My goal is to become a successful software developer.
        </div>
    </div>

</body>
</html>
